name: Watch Upstream Release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest upstream release (max semver, not publish order)
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub /releases is publish-order; maintenance tags (e.g. v29.4) can
          # appear before the true latest (v31.x). Pick max parseable semver.
          LATEST=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/bitcoin/bitcoin/releases?per_page=50" \
            | jq -r '
              [.[] | select(.prerelease == false and .draft == false) | .tag_name
               | ltrimstr("v")
               | select(test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?$"))]
              | sort_by(split(".") | map(tonumber))
              | last
            ')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Could not detect upstream version (rate-limited or no stable release)"
            exit 1
          fi
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "tag=v${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Latest upstream (max semver): v${LATEST}"

      - name: Read current version
        id: current
        run: |
          CURRENT=$(tr -d '[:space:]' < VERSION)
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT"

      - name: Check if update needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          CURRENT="${{ steps.current.outputs.version }}"
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "Already up to date"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EXISTING_PR=$(gh pr list --head "release/${VERSION}" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already open for ${VERSION}"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "New version available: ${VERSION}"
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Detect signing keys
        if: steps.check.outputs.needed == 'true'
        id: keys
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          curl -sLO "https://bitcoincore.org/bin/bitcoin-core-${VERSION}/SHA256SUMS.asc" || true
          if [ -f SHA256SUMS.asc ]; then
            KEY_IDS=$(gpg --list-packets SHA256SUMS.asc 2>/dev/null | grep "keyid" | awk '{print $NF}' | sort -u | tr '\n' ' ')
            echo "key_ids=$KEY_IDS" >> "$GITHUB_OUTPUT"
          else
            echo "key_ids=unable to fetch" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or reopen release PR
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          BRANCH="release/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${BRANCH}"
            git checkout "${BRANCH}"
            echo "$VERSION" > VERSION
            if ! git diff --quiet VERSION; then
              git add VERSION
              git commit -m "release: bump to v${VERSION}"
              git push origin "${BRANCH}"
            fi
          else
            git checkout -b "$BRANCH"
            echo "$VERSION" > VERSION
            git add VERSION
            git commit -m "release: bump to v${VERSION}"
            git push origin "$BRANCH"
          fi

          if ! gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create \
              --title "Release ${VERSION}" \
              --body "$(cat <<EOF
          ## Bitcoin Core ${VERSION}

          Upstream release: https://github.com/bitcoin/bitcoin/releases/tag/${{ steps.upstream.outputs.tag }}
          Download: https://bitcoincore.org/bin/bitcoin-core-${VERSION}/

          ### Detected signing key IDs
          \`\`\`
          ${{ steps.keys.outputs.key_ids }}
          \`\`\`

          ### Action required (human gate — GPG)
          - [ ] Verify GPG signing keys match [trusted keys](https://github.com/bitcoin-core/guix.sigs)
          - [ ] Update \`KEYS\` file if signers changed
          - [ ] Review upstream release notes for breaking changes

          Merging this PR triggers a build of \`ghcr.io/kub0-ai/bitcoin-core:${VERSION}\`.
          EOF
          )" || true
          fi

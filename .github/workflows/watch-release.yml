name: Watch Upstream Release

# Two-stage release automation with a SIGNER-CONDITIONAL human gate.
#
#   detect upstream -> preflight the Dockerfile's own GPG gate -> decide:
#     PASS : auto-merge the release PR, then dispatch build.yml. Hands-off.
#            The trust root (KEYS) already covers this release, so a human
#            clicking "merge" adds no security -- only latency.
#     FAIL : open/keep the PR, DO NOT merge, exit 1 (red). A human must review
#            the signer change and decide whether to extend KEYS.
#
# Why an explicit workflow_dispatch instead of relying on build.yml's push
# trigger: events raised by the default GITHUB_TOKEN do not create new workflow
# runs (GitHub's anti-recursion rule), so an auto-merged VERSION bump would land
# on main and never build. workflow_dispatch and repository_dispatch are the
# documented exceptions -- they always create a run. Hence `gh workflow run`.
#
# Why FAIL is red rather than a quiet PR: this job used to `exit 0` on BOTH
# "already up to date" AND "PR already open", which made a 44-day-stalled
# release indistinguishable from a healthy repo in the runs list. PR #1
# (Release 31.1) sat open 2026-07-29 -> 2026-09-11 behind a daily green tick.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # required to dispatch build.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # "In a public repository, scheduled workflows are automatically disabled
      # when no repository activity has occurred in 60 days." A quiet upstream
      # therefore kills this watcher -- and GitHub does NOT re-enable on new
      # activity, it requires a manual click. So keep the repo warm well inside
      # the window rather than trying to cure it afterwards. Runs daily, acts
      # roughly monthly, and sustains itself because acting resets the clock.
      - name: Keepalive (prevent 60-day cron auto-disable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LAST=$(git log -1 --format=%ct main 2>/dev/null || git log -1 --format=%ct)
          AGE=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "days since last commit on main: ${AGE}"
          if [ "$AGE" -ge 40 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive — hold scheduled workflows active (${AGE}d quiet)"
            git push origin HEAD:main
            echo "::notice title=Keepalive::pushed empty commit after ${AGE} quiet days"
          fi

      - name: Get latest upstream release (max semver, not publish order)
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GitHub /releases is publish-order; maintenance tags (e.g. v29.4) can
          # appear before the true latest (v31.x). Pick max parseable semver.
          LATEST=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/bitcoin/bitcoin/releases?per_page=50" \
            | jq -r '
              [.[] | select(.prerelease == false and .draft == false) | .tag_name
               | ltrimstr("v")
               | select(test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?$"))]
              | sort_by(split(".") | map(tonumber))
              | last
            ')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Could not detect upstream version (rate-limited or no stable release)"
            exit 1
          fi
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "tag=v${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Latest upstream (max semver): v${LATEST}"

      - name: Read current version
        id: current
        run: |
          set -euo pipefail
          CURRENT=$(tr -d '[:space:]' < VERSION)
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT"

      - name: Check if update needed
        id: check
        env:
          UPSTREAM: ${{ steps.upstream.outputs.version }}
          CURRENT: ${{ steps.current.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$UPSTREAM" = "$CURRENT" ]; then
            echo "Already up to date at ${CURRENT}"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Up to date"
              echo ""
              echo "\`VERSION\` = upstream latest = \`${CURRENT}\`. Nothing to do."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "New version available: ${CURRENT} -> ${UPSTREAM}"
          echo "needed=true" >> "$GITHUB_OUTPUT"

      # Preflight the EXACT gate docker/Dockerfile applies at build time:
      #   import only KEYS-allowlisted fingerprints (no TOFU),
      #   require >=1 GOODSIG (EXPKEYSIG alone is not accepted),
      #   require every VALIDSIG fingerprint to be inside the allowlist.
      # If this passes, the build will pass -- so merging is mechanical and
      # needs no human. If it fails, the trust root no longer covers upstream
      # and that IS the case worth a person's attention.
      - name: Preflight signing gate
        if: steps.check.outputs.needed == 'true'
        id: gpg
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          WORK=$(mktemp -d); export GNUPGHOME=$(mktemp -d); chmod 700 "$GNUPGHOME"
          KEYS=$(tr '\n' ' ' < KEYS)

          curl -sSLf -o "$WORK/SHA256SUMS" \
            "https://bitcoincore.org/bin/bitcoin-core-${VERSION}/SHA256SUMS"
          curl -sSLf -o "$WORK/SHA256SUMS.asc" \
            "https://bitcoincore.org/bin/bitcoin-core-${VERSION}/SHA256SUMS.asc"

          # Import ONLY allowlisted keys. An unknown signer is therefore never
          # imported, yields NO_PUBKEY rather than VALIDSIG, and is ignored --
          # it can neither grant nor withdraw trust.
          for key in $KEYS; do
            gpg --batch --keyserver keyserver.ubuntu.com --recv-keys "$key" >/dev/null 2>&1 \
              || gpg --batch --keyserver keys.openpgp.org --recv-keys "$key" >/dev/null 2>&1 \
              || gpg --batch --keyserver pgp.mit.edu --recv-keys "$key" >/dev/null 2>&1 \
              || echo "WARN: could not fetch allowlisted key $key from any keyserver"
          done

          STATUS=$(gpg --verify --status-fd=1 "$WORK/SHA256SUMS.asc" "$WORK/SHA256SUMS" 2>/dev/null || true)

          # NOTE: herestrings, not pipelines. `CMD | grep -q PAT` under pipefail
          # returns 141 (SIGPIPE) when PAT matches, which silently inverts the
          # test. Feed grep from <<< so there is no pipe to break.
          GOOD=$(grep -c '^\[GNUPG:\] GOODSIG '   <<< "$STATUS" || true)
          UNKNOWN=$(grep -c '^\[GNUPG:\] NO_PUBKEY ' <<< "$STATUS" || true)
          EXPIRED=$(grep -c '^\[GNUPG:\] EXPKEYSIG ' <<< "$STATUS" || true)

          ALLOW=$(echo "$KEYS" | tr -d '[:space:]' | tr 'a-f' 'A-F')
          ROGUE=""
          while read -r sign_fp primary_fp; do
            [ -z "${sign_fp:-}" ] && continue
            matched=0
            for fp in "$sign_fp" "$primary_fp"; do
              [ -z "$fp" ] && continue
              case "$ALLOW" in *"$fp"*) matched=1; break ;; esac
            done
            [ "$matched" -eq 1 ] || ROGUE="${ROGUE} ${sign_fp}"
          done < <(awk '/^\[GNUPG:\] VALIDSIG /{print toupper($3), toupper($NF)}' <<< "$STATUS")

          VERDICT=pass
          REASON="gate satisfied"
          if [ "$GOOD" -lt 1 ]; then
            VERDICT=fail
            REASON="no GOODSIG from any allowlisted key (EXPKEYSIG alone is not accepted)"
          elif [ -n "$ROGUE" ]; then
            VERDICT=fail
            REASON="VALIDSIG fingerprint(s) outside the KEYS allowlist:${ROGUE}"
          fi

          {
            echo "verdict=$VERDICT"
            echo "reason=$REASON"
            echo "good=$GOOD"
            echo "unknown=$UNKNOWN"
            echo "expired=$EXPIRED"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Signing preflight for ${VERSION} — **${VERDICT}**"
            echo ""
            echo "| signal | count |"
            echo "|---|---|"
            echo "| GOODSIG (trusted signers) | ${GOOD} |"
            echo "| NO_PUBKEY (unknown signers, ignored) | ${UNKNOWN} |"
            echo "| EXPKEYSIG (trusted but expired) | ${EXPIRED} |"
            echo ""
            echo "Verdict reason: ${REASON}"
            if [ "$UNKNOWN" -gt 0 ]; then
              echo ""
              echo "> ${UNKNOWN} signer(s) are not in \`KEYS\`. They neither grant nor"
              echo "> withdraw trust, but a rising count means the upstream signer set is"
              echo "> drifting away from this allowlist — worth extending \`KEYS\` deliberately."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "preflight ${VERDICT}: ${REASON} (good=${GOOD} unknown=${UNKNOWN} expired=${EXPIRED})"

      - name: Create or update release PR
        if: steps.check.outputs.needed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.upstream.outputs.version }}
          TAG: ${{ steps.upstream.outputs.tag }}
          VERDICT: ${{ steps.gpg.outputs.verdict }}
          REASON: ${{ steps.gpg.outputs.reason }}
          GOOD: ${{ steps.gpg.outputs.good }}
          UNKNOWN: ${{ steps.gpg.outputs.unknown }}
          EXPIRED: ${{ steps.gpg.outputs.expired }}
        run: |
          set -euo pipefail
          BRANCH="release/${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
          echo "$VERSION" > VERSION
          if ! git diff --quiet VERSION; then
            git add VERSION
            git commit -m "release: bump to v${VERSION}"
          fi
          git push origin "$BRANCH"

          NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "Release ${VERSION}" \
              --body "$(cat <<EOF
          ## Bitcoin Core ${VERSION}

          Upstream release: https://github.com/bitcoin/bitcoin/releases/tag/${TAG}
          Download: https://bitcoincore.org/bin/bitcoin-core-${VERSION}/

          ### Signing preflight — **${VERDICT}**

          | signal | count |
          |---|---|
          | GOODSIG (trusted signers) | ${GOOD} |
          | NO_PUBKEY (unknown signers, ignored) | ${UNKNOWN} |
          | EXPKEYSIG (trusted but expired) | ${EXPIRED} |

          ${REASON}

          A **pass** means the trust root in \`KEYS\` already covers this release and the
          image build will verify cleanly — this PR is auto-merged and built.

          A **fail** means this PR is held for review. Check the upstream signer set
          against [guix.sigs](https://github.com/bitcoin-core/guix.sigs), extend \`KEYS\`
          if the change is legitimate, then re-run this workflow.
          EOF
          )"
            NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          echo "Release PR #${NUM} for ${VERSION}"

      - name: Auto-merge and dispatch build (preflight passed)
        if: steps.check.outputs.needed == 'true' && steps.gpg.outputs.verdict == 'pass'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.upstream.outputs.version }}
          NUM: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr merge "$NUM" --merge --delete-branch

          # The merge above is authenticated with GITHUB_TOKEN, so its push does
          # NOT trigger build.yml. Dispatch explicitly -- workflow_dispatch is a
          # documented exception to the anti-recursion rule and always runs.
          gh workflow run build.yml --ref main
          {
            echo ""
            echo "### Auto-merged"
            echo ""
            echo "PR #${NUM} merged; \`build.yml\` dispatched on \`main\` for \`${VERSION}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hold for human review (preflight failed)
        if: steps.check.outputs.needed == 'true' && steps.gpg.outputs.verdict != 'pass'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          REASON: ${{ steps.gpg.outputs.reason }}
          NUM: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### HELD — signing gate not satisfied"
            echo ""
            echo "PR #${NUM} (\`${VERSION}\`) is open and **not** merged: ${REASON}"
            echo ""
            echo "This run fails deliberately so the stall is visible in the runs list."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Release ${VERSION} held::${REASON} — see PR #${NUM}"
          exit 1

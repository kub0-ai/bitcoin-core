name: Backfill Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bitcoin Core version (e.g., 27.2)'
        required: true
      keys:
        description: 'Optional GPG fingerprints (space-separated). Must be non-empty subset of repo KEYS file. Default: full KEYS file. Empty values are refused (no TOFU).'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve KEYS (require non-empty allowlist; no TOFU)
        id: keys
        run: |
          set -euo pipefail
          if [ ! -s KEYS ]; then
            echo "ERROR: repo KEYS file is missing or empty"
            exit 1
          fi
          REPO_KEYS=$(tr '\n' ' ' < KEYS | xargs)
          INPUT_KEYS="${{ github.event.inputs.keys }}"
          # trim
          INPUT_KEYS=$(echo "$INPUT_KEYS" | xargs || true)
          if [ -n "$INPUT_KEYS" ]; then
            KEYS="$INPUT_KEYS"
            # every override fingerprint must appear in repo KEYS (case-insensitive hex)
            REPO_HEX=$(echo "$REPO_KEYS" | tr -d '[:space:]' | tr 'a-f' 'A-F')
            for k in $KEYS; do
              ku=$(echo "$k" | tr -d '[:space:]' | tr 'a-f' 'A-F')
              case "$REPO_HEX" in
                *"$ku"*) ;;
                *)
                  echo "ERROR: fingerprint $k is not in repo KEYS allowlist"
                  exit 1
                  ;;
              esac
            done
          else
            KEYS="$REPO_KEYS"
          fi
          if [ -z "$(echo "$KEYS" | tr -d '[:space:]')" ]; then
            echo "ERROR: resolved KEYS is empty — refusing TOFU / empty-keys path"
            exit 1
          fi
          echo "keys=$KEYS" >> "$GITHUB_OUTPUT"
          echo "Resolved $(echo "$KEYS" | wc -w) fingerprint(s) from allowlist"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.event.inputs.version }}
            KEYS=${{ steps.keys.outputs.keys }}
          tags: ghcr.io/kub0-ai/bitcoin-core:${{ github.event.inputs.version }}
          cache-from: type=registry,ref=ghcr.io/kub0-ai/bitcoin-core:buildcache
          cache-to: type=registry,ref=ghcr.io/kub0-ai/bitcoin-core:buildcache,mode=max

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ github.event.inputs.version }}" -m "Bitcoin Core ${{ github.event.inputs.version }}" || true
          git push origin "v${{ github.event.inputs.version }}" || true
